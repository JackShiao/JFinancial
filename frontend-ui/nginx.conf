server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API Proxy ────────────────────────────────────────────
    # ${NGINX_BACKEND_URL} 由 nginx:alpine 的 envsubst 在啟動時替換
    # 本機 Docker Compose：NGINX_BACKEND_URL=http://backend:8080
    # GCP Cloud Run    ：NGINX_BACKEND_URL=https://jfinancial-backend-xxx.a.run.app
    location /api/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_ssl_server_name on;
    }

    # ── OAuth2 觸發端點 ──────────────────────────────────────
    # Google OIDC 回應包含 nonce + PKCE cookie，header 較大，需調整 proxy buffer
    location /oauth2/authorization/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_ssl_server_name on;
        proxy_buffer_size      8k;
        proxy_buffers          4 8k;
        proxy_busy_buffers_size 16k;
    }

    location /login/oauth2/ {
        proxy_pass ${NGINX_BACKEND_URL};
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_ssl_server_name on;
        proxy_buffer_size      8k;
        proxy_buffers          4 8k;
        proxy_busy_buffers_size 16k;
    }

    # ── 前端靜態資源 ─────────────────────────────────────────
    # React Router fallback：找不到實體檔案時回傳 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 安全 Headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy "strict-origin"    always;
}
