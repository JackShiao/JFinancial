server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Resolver：使用 Docker 內建 DNS，啟用延遲解析 ──────────
    # 用變數賦值 proxy_pass，避免 Nginx 在啟動時直接解析 hostname
    # 若找不到 upstream（單獨執行前端容器時），Nginx 仍可正常啟動
    resolver 127.0.0.11 valid=10s;

    # ── API Proxy：轉發到後端（容器名稱由 docker compose 決定）──
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OAuth2 觸發端點 ──────────────────────────────────────
    location /oauth2/authorization/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 前端靜態資源 ─────────────────────────────────────────
    # React Router：找不到實體檔案時，一律回傳 index.html
    # 避免重新整理或直接輸入 URL 時出現 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 安全 Headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy "strict-origin"    always;
}
