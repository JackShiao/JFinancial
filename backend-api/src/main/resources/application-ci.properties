# =====================================================
# CI 測試環境專用設定（覆蓋 application.properties）
# 此檔案安全提交至版本庫，不含任何真實機密資訊
# =====================================================

# 連線至 GitHub Actions MySQL service container
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/jfinancial?serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

# CI 環境不啟動排程，加快測試速度並避免外部 API 呼叫失敗
scheduler.forex.fixed-rate=2147483647
scheduler.bond.fixed-rate=2147483647
scheduler.stock.fixed-rate=2147483647
scheduler.twse.fixed-rate=2147483647

# 外部 API Key 填佔位字串（CI 測試不需實際呼叫）
fred.api.key=ci-placeholder
fugle.api.key=ci-placeholder

# JWT Secret（CI 測試用，須符合長度要求）
jwt.secret=ci-test-secret-must-be-at-least-32-chars-long!

# OAuth2（CI 測試用佔位字串，避免 Spring Security 自動配置報錯）
spring.security.oauth2.client.registration.google.client-id=ci-placeholder
spring.security.oauth2.client.registration.google.client-secret=ci-placeholder
spring.security.oauth2.client.registration.github.client-id=ci-placeholder
spring.security.oauth2.client.registration.github.client-secret=ci-placeholder

# ECPay
ecpay.notify-url=http://localhost/ci-placeholder
