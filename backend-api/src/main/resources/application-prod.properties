# =====================================================
# 生產環境設定 (GCP Cloud Run + Cloud SQL)
# 啟用方式：SPRING_PROFILES_ACTIVE=prod
# 敏感值（DB密碼、JWT Secret、API Key）一律由 Cloud Run
# 注入的環境變數覆蓋，此檔案不含任何機敏資料，可安全提交。
# =====================================================

# ── 資料庫：透過 Cloud SQL Auth Proxy Unix Socket 連線 ──
# Cloud Run 部署時設定 --add-cloudsql-instances 後，
# Proxy 會在 /cloudsql/PROJECT:REGION:INSTANCE 建立 socket
spring.datasource.url=jdbc:mysql:///jfinancial\
  ?cloudSqlInstance=jfinancial:asia-east1:jfinancial-db\
  &socketFactory=com.google.cloud.sql.mysql.SocketFactory\
  &useSSL=false\
  &allowPublicKeyRetrieval=true\
  &serverTimezone=UTC\
  &characterEncoding=UTF-8
spring.datasource.username=root
# spring.datasource.password → 由 Cloud Run 環境變數 SPRING_DATASOURCE_PASSWORD 注入

# ── Reverse Proxy / Cloud Run HTTPS 支援 ────────────────
# 讓 Spring Boot 信任 X-Forwarded-Proto header，
# 使 OAuth2 redirect_uri 正確生成 https:// 而非 http://
server.forward-headers-strategy=framework

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── 排程延遲（Cloud Run 冷啟動較慢，給足時間再開始抓資料）──
scheduler.forex.initial-delay=30000
scheduler.bond.initial-delay=35000
scheduler.stock.initial-delay=40000
scheduler.twse.initial-delay=45000

# ── CORS：允許前端 Cloud Run 服務的來源 ─────────────────
# 初次部署後請將 * 改為實際前端 URL，例如：
# cors.allowed-origins=https://jfinancial-frontend-xxxxxxxx-de.a.run.app
cors.allowed-origins=*

# ── 前端 Base URL（OAuth2 登入後重導目的地）────────────────
# 請在 GitHub Actions 以環境變數 FRONTEND_BASE_URL 覆蓋
frontend.base-url=https://jfinancial-frontend.example.com

# ── OAuth2 redirect-uri：讓 callback 走前端 nginx ──────────
# callback 必須經過前端 nginx，才能讓 JWT Cookie 設定在前端 domain，
# 避免 /api/auth/me 因 cookie domain 不同而帶不到 token。
spring.security.oauth2.client.registration.github.redirect-uri=${frontend.base-url}/login/oauth2/code/github
spring.security.oauth2.client.registration.google.redirect-uri=${frontend.base-url}/login/oauth2/code/google

# ── ECPay URL 設定（生產環境）──────────────────────────────
# ReturnURL：ECPay S2S 付款結果通知（由 ECPAY_NOTIFY_URL 環境變數覆蓋）
ecpay.notify-url=https://jfinancial-backend-gghtso4rrq-de.a.run.app/api/payment/ecpay/notify
# OrderResultURL：付款後瀏覽器 POST 回後端，後端再 302 redirect 到前端
ecpay.return-url=https://jfinancial-backend-gghtso4rrq-de.a.run.app/api/payment/ecpay/return
# 前端結果頁（後端 redirect 的目的地）
ecpay.frontend-result-url=https://jfinancial-frontend-gghtso4rrq-de.a.run.app/subscription/result

# ── 匯入本機覆蓋設定（Cloud Run 環境無此檔案，optional 不影響啟動）──
spring.config.import=optional:classpath:application-local.properties
