name: Backend CI

# 觸發條件：push 或 PR 時，只要 backend-api/ 有異動就觸發
on:
  push:
    paths:
      - 'backend-api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend-api/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Build & Test (Java 21 + MySQL)
    runs-on: ubuntu-latest

    # ── 服務容器：提供測試用 MySQL ──────────────────────────────
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: jfinancial
        ports:
          - 3306:3306
        # 等 MySQL 真的就緒才繼續，否則連線會失敗
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p123456"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # 1. 取得程式碼
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 初始化資料庫 Schema（與本機 Docker 相同的 SQL 腳本）
      - name: Init DB Schema
        run: |
          mysql -h 127.0.0.1 -u root -p123456 jfinancial \
            < docker/mysql/init/init_jfinancial_schema.sql

      # 3. 設定 Java 21，並啟用 Maven 相依套件快取加速後續 build
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 4. 執行測試
      #    -Dspring.profiles.active=ci  → 讓 Spring 讀 application-ci.properties
      #    --no-transfer-progress       → 減少 CI log 噪音
      - name: Run Tests
        working-directory: backend-api
        run: |
          ./mvnw test \
            -Dspring.profiles.active=ci \
            --no-transfer-progress
